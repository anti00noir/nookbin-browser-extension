<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>File Dropper</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --border: #3d3d3d;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #4a9eff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      min-height: 260px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
    }

    #dropZone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 22px 12px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    #dropZone.dragover {
      border-color: var(--accent);
      background: rgba(74, 158, 255, .08);
      color: var(--accent);
    }
    #dropZone .hint { font-size: 11px; margin-top: 4px; }

    #fileList {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
    }
    #fileList:empty::after {
      content: "No files stored yet.";
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px 0;
    }
    #fileList li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      background: var(--panel);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    #fileList .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #fileList .meta {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }
    #fileList button {
      flex-shrink: 0;
      border: none;
      border-radius: 4px;
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    #fileList button:hover { filter: brightness(1.1); }
    #fileList button.delete {
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
    }
    #fileList button.delete:hover { color: #ff5a5a; }

    #status {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
      text-align: center;
    }
    #status.error { color: #ff5a5a; }
    #status.success { color: #4ac97e; }
  </style>
</head>
<body>
  <h1>File Dropper</h1>

  <div id="dropZone" role="button" tabindex="0" aria-label="Drop files here or click to browse">
    Drop files here to store
    <div class="hint">or click to browse</div>
    <input type="file" id="filePicker" multiple hidden />
  </div>

  <ul id="fileList"></ul>

  <div id="status" role="status" aria-live="polite"></div>

  <script src="src/popup.js" type="module"></script>
</body>
</html>
